<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#e9e9e6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e0e0d" media="(prefers-color-scheme: dark)" />
    <title>App-Details · Rack</title>
    <link rel="icon" type="image/png" href="/img/dashboard.png" />
    <script>
      (function () {
        try {
          if (sessionStorage.getItem('dashboard-fingerprint-detail-unlock') !== '1') {
            location.replace('/');
            return;
          }
        } catch (e) {
          location.replace('/');
          return;
        }
        var theme = 'light';
        try {
          var stored = localStorage.getItem('theme');
          if (stored === 'dark' || stored === 'light') theme = stored;
          else if (matchMedia('(prefers-color-scheme: dark)').matches) theme = 'dark';
        } catch (e) {}
        document.documentElement.classList.toggle('dark', theme === 'dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/detail/main.tsx"></script>
  </body>
</html>
